name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Starfield.scr dist/
          Copy-Item LICENSE, README.md, README.ru.md dist/
          $name = "Starfield-$env:GITHUB_REF_NAME-win64.zip"
          Compress-Archive -Path dist/* -DestinationPath $name

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Starfield-$env:GITHUB_REF_NAME-win64.zip"
          gh release create $env:GITHUB_REF_NAME build/Starfield.scr $zip `
            --title "Starfield Screensaver $env:GITHUB_REF_NAME" `
            --generate-notes
